services:
  postgres:
    image: postgres:16-alpine
    container_name: p20-lounge-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: p20
      POSTGRES_PASSWORD: p20
      POSTGRES_DB: p20_lounge_club
    ports:
      - "5432:5432"
    volumes:
      - p20-postgres-data:/var/lib/postgresql/data

volumes:
  p20-postgres-data:
